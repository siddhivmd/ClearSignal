model:
  name: "distilbert-base-uncased"
  num_labels: 2
  max_length: 128

data:
  input_csv: "data/custom_labels_clean.csv"
  binary_csv: "data/custom_labels_binary.csv"
  label_source: "human"   # "human" = source dataset annotations, "auto" = RoBERTa auto-labels
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42
  # Phase 2 multi-label scope (see README "Label Scope"). "clean" = no label is positive.
  # misinformation is deferred: no public human-labelled dataset fits this task.
  labels: ["toxic", "hate_speech", "harassment", "spam", "self_harm"]

multilabel:
  output_csv: "data/multilabel.csv"
  civil_comments:
    threshold: 0.5          # fraction of raters needed for a positive label
    clean_max_score: 0.1    # "clean" comments must score below this on every attribute
    samples_per_label: 5000 # max positives sampled per label
    clean_samples: 10000
  self_harm:
    samples_per_class: 5000
  mhs:
    rater_agree_min: 3      # MHS ratings are 0-4 (higher = worse); 3 = agree, 4 = strongly agree
    positive_share: 0.5     # share of raters who must agree for a positive label

multilabel_training:
  model_name: "distilbert-base-uncased"
  max_length: 128
  # Quick CPU sanity run. For the full run (Colab GPU) set both to null and epochs to 2-3.
  max_train_rows: 6000
  max_eval_rows: 2000
  epochs: 1
  batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  save_dir: "models/clearsignal-ml-v2"

training:
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  save_dir: "models/clearsignal-v2"
